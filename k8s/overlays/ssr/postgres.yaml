apiVersion: v1
kind: Service
metadata:
  name: flint-gate-postgres
  labels:
    app.kubernetes.io/name: flint-gate-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: flint-gate-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flint-gate-postgres
  labels:
    app.kubernetes.io/name: flint-gate-postgres
    prometheusags.ai/backup-required: "true"
  annotations:
    prometheusags.ai/backup-policy: daily-7d
    prometheusags.ai/restore-runbook: docs/deployment/stateful-restore.md
spec:
  serviceName: flint-gate-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flint-gate-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flint-gate-postgres
    spec:
      securityContext:
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: flint-gate-database
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flint-gate-database
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: flint-gate-database
                  key: database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          prometheusags.ai/backup-required: "true"
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 8Gi
