name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust (test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check migrations
        env:
          # A reviewed renumbering of migrations that never reached production
          # can opt out of the immutability check with this PR label.
          ALLOW_MIGRATION_CHANGES: ${{ contains(github.event.pull_request.labels.*.name, 'migration-renumber') && '1' || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/check-migrations.sh "origin/${{ github.base_ref }}"
          else
            scripts/check-migrations.sh
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Tests
        run: cargo test --workspace

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t flint-gate:ci .
