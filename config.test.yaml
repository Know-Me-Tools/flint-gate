# ─────────────────────────────────────────────────────────────────────────────
# Flint Gate — SDK Integration-Test Configuration (docker-compose.test.yml)
# ─────────────────────────────────────────────────────────────────────────────
# Used exclusively for Go/TypeScript SDK integration tests against the
# docker-compose.test.yml fixture. Uses a static admin token so test clients
# authenticate without requiring a Hydra OAuth2 client-credentials flow.
# NOT for production — plaintext token, insecure upstreams, isolated network.
# ─────────────────────────────────────────────────────────────────────────────

server:
  listen: "0.0.0.0:4456"
  # Docker port mappings cannot reach a loopback bind inside the container, so
  # the admin API binds all interfaces. A non-loopback bind requires
  # admin_auth; this isolated fixture uses the anonymous provider so the SDK
  # tests can call it without credentials. Never do this outside tests.
  admin_listen: "0.0.0.0:4457"
  admin_auth:
    provider:
      type: anonymous
      default_subject: "integration-admin"
  allow_insecure_upstream: true
  # Strict agent governance is the default (true). All test routes must have
  # an authorize hook — see the stream-test route below.
  strict_agent_governance: true
  tls:
    enabled: false

database:
  url: "postgres://flintgate:flintgate@postgres:5432/flintgate"
  max_connections: 10

cache:
  l1:
    max_capacity: 1000
    ttl_seconds: 60
  l2:
    enabled: false

auth_providers:
  hydra_jwt:
    type: jwt
    jwks_url: "http://hydra:4444/.well-known/jwks.json"
    issuer: "http://hydra:4444"
    leeway_seconds: 5
  # The approval-flow tests exercise Cedar tool-call approval, not
  # authentication, so their stream route uses an anonymous identity.
  integration_anon:
    type: anonymous
    default_subject: "integration-agent"

jwt:
  signing_algorithm: "HS256"
  signing_key_secret: "test-jwt-secret"
  issuer: "http://flint-gate:4456"
  default_ttl_seconds: 300

token_exchange:
  enabled: false

oauth:
  client_credentials_enabled: false
  introspection_enabled: false

sites:
  - id: "test"
    domains: ["localhost:4456"]
    default_auth: hydra_jwt
    default_upstream: "http://flint-gate:4457/health"

approval:
  enabled: true
  backend: memory
  ttl_seconds: 5
  janitor_interval_seconds: 1

routes:
  # ── Streaming approval-flow integration test route ─────────────────────────
  # Used exclusively by TestIntegration_ApprovalFlow.
  # The Cedar @require_approval policy is created at test runtime via Admin API.
  - id: "stream-test"
    site: "test"
    match:
      path: "/stream-test"
      methods: ["POST"]
    upstream: "http://mock-upstream:9999"
    auth: integration_anon
    stream:
      enabled: true
      protocol: ndjson
      # Tool calls are only governed when AG-UI event parsing is enabled.
      ai:
        ag_ui:
          enabled: true
          validate_events: false
    hooks:
      pre_request:
        - type: authorize
          config: {}
